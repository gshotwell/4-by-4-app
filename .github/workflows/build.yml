name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk hr4x4-coach.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hr4x4-coach
          path: hr4x4-coach.apk
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hr4x4-coach.apk \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Open this page on your phone and tap hr4x4-coach.apk to install." \
            --target "${{ github.sha }}"
