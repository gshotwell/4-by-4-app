name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK and App Bundle
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Rename
        run: |
          cp app/build/outputs/apk/release/app-release.apk hr4x4-coach.apk
          cp app/build/outputs/bundle/release/app-release.aab hr4x4-coach.aab
      - uses: actions/upload-artifact@v4
        with:
          name: hr4x4-coach
          path: |
            hr4x4-coach.apk
            hr4x4-coach.aab
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hr4x4-coach.apk hr4x4-coach.aab \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Open this page on your phone and tap hr4x4-coach.apk to install." \
            --target "${{ github.sha }}"
      # Uploads to Play's internal testing track once the PLAY_SERVICE_ACCOUNT_JSON secret exists.
      # (The very first upload of a new app has to be done by hand in Play Console.)
      - name: Upload to Google Play (internal testing)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gshotwell.hr4x4
          releaseFiles: hr4x4-coach.aab
          track: internal
          status: completed
